  <rect x="70" y="744" width="1460" height="346" rx="28" fill="#ffffff" stroke="#d3e5db"/>
  <text class="node-title" x="110" y="796">Orden logico sugerido del recorrido movil</text>
  <text class="node-copy" x="110" y="826">1. Acceso o registro del usuario.</text>
  <text class="node-copy" x="110" y="856">2. Ingreso al home con buscador, categorias visibles y productos destacados.</text>
  <text class="node-copy" x="110" y="886">3. Consulta del detalle del producto y adicion al carrito.</text>
  <text class="node-copy" x="110" y="916">4. Revision del resumen de compra, paso por pago y confirmacion del pedido.</text>
  <text class="node-copy" x="110" y="946">5. Seguimiento posterior desde historial, estado del pedido, soporte y perfil.</text>
  <text class="node-copy" x="110" y="996">Principios de usabilidad aplicados: visibilidad del estado, consistencia, feedback, botones claros, rutas cortas y contenido priorizado para pantalla movil.</text>
  <text class="node-copy" x="110" y="1036">Principios de accesibilidad aplicados: contraste alto, areas tactiles amplias, textos legibles, labels claros, orden semantico y soporte para navegacion sencilla.</text>
</svg>
