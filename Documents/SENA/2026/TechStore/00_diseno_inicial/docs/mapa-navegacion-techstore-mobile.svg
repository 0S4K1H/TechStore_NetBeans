    <path class="line" d="M1260 484 V540"/>
    <path class="line" d="M1080 540 H1440"/>
    <path class="line" d="M1080 540 V580"/>
    <path class="line" d="M1200 540 V580"/>
    <path class="line" d="M1320 540 V580"/>
    <path class="line" d="M1440 540 V580"/>
