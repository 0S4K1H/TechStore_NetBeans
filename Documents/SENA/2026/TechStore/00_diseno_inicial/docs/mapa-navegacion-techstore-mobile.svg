    <text class="node-title" x="1180" y="620">FAQ</text>
    <rect x="1240" y="580" width="170" height="70" rx="18" fill="#ffffff" stroke="#d9e7ee"/>
    <text class="node-title" x="1273" y="620">Mi perfil</text>
