<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de navegacion jerarquico para TechStore Mobile</title>
  <desc id="desc">Arbol jerarquico con secciones principales y secundarias de la aplicacion movil TechStore.</desc>
  <defs>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e8f39"/>
      <stop offset="100%" stop-color="#12b247"/>
    </linearGradient>
    <linearGradient id="root" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f2f"/>
      <stop offset="100%" stop-color="#153f59"/>
    </linearGradient>
    <style>
      .bg { fill: #f6fbf8; }
      .line { stroke: #8fbfa1; stroke-width: 3; fill: none; }
      .title { font: 700 34px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #daf5e2; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #173042; }
      .node-copy { font: 500 13px Arial, sans-serif; fill: #49606f; }
      .section-copy { font: 500 14px Arial, sans-serif; fill: #ffffff; }
      .pill { fill: #ffffff; opacity: 0.16; }
      .label { font: 700 16px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1180" rx="26"/>
  <rect x="32" y="28" width="1536" height="116" rx="24" fill="url(#header)"/>
  <text class="title" x="72" y="78">Mapa de navegacion - TechStore Mobile</text>
  <text class="subtitle" x="72" y="114">Tipo sugerido: estructura compuesta con base jerarquica para app movil de comercio electronico.</text>
  <rect class="pill" x="1180" y="54" width="320" height="56" rx="28"/>
  <text class="label" x="1222" y="89">Cliente · Usabilidad · Accesibilidad</text>

  <rect x="620" y="182" width="360" height="94" rx="24" fill="url(#root)"/>
  <text class="label" x="722" y="221">TechStore Mobile</text>
  <text class="section-copy" x="668" y="248">Punto de entrada principal de la APP</text>

  <path class="line" d="M800 276 V336"/>
  <path class="line" d="M300 402 H1300"/>

  <path class="line" d="M300 336 V402"/>
  <path class="line" d="M540 336 V402"/>
  <path class="line" d="M780 336 V402"/>
  <path class="line" d="M1020 336 V402"/>
  <path class="line" d="M1260 336 V402"/>

  <g>
    <rect x="170" y="402" width="260" height="82" rx="22" fill="#ffffff" stroke="#cfe8d6"/>
