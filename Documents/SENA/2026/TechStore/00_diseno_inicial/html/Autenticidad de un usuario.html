<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso principal a TechStore para perfiles de cliente, empleado y administrador.">
  <meta name="theme-color" content="#071a27">
  <link rel="stylesheet" href="css/autenticidad de un usuario.css">
  <link rel="stylesheet" href="css/techstore-shell.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>Acceso | TechStore</title>
</head>

<body>
  <!-- Curva superior TechStore -->
  <div class="curve-top"></div>

  <!-- Figuras decorativas de programacion -->
  <div class="code-bg" aria-hidden="true">
    <i class="fas fa-code"></i>
    <i class="fas fa-laptop-code"></i>
    <i class="fab fa-js-square"></i>
    <i class="fab fa-python"></i>
    <i class="fas fa-database"></i>
    <i class="fas fa-server"></i>
    <i class="fas fa-terminal"></i>
    <i class="fas fa-cogs"></i>
  </div>

  <main class="card auth-card">
    <!-- Logo TechStore -->
    <div class="logo-container">
      <img src="img/Techstore-logo.png" alt="Logo TechStore">
    </div>

    <!-- Icono principal -->
    <div class="central-icon">
      <i class="fas fa-microchip"></i>
    </div>

    <h1 class="title">TECHSTORE</h1>
    <p class="subtitle">Accede como cliente, empleado o administrador desde un mismo punto de entrada.</p>
    <p class="access-note">Usa una cuenta autorizada para ingresar al ecosistema TechStore.</p>

    <form id="loginForm">
      <!-- Campo Usuario -->
      <div class="input-group">
        <i class="fas fa-user icon"></i>
        <input type="text" id="username" placeholder="Nombre de usuario" required autocomplete="username">
      </div>

      <!-- Campo Contrasena -->
      <div class="input-group">
        <i class="fas fa-key icon"></i>
        <input type="password" id="password" placeholder="Contrasena segura" required autocomplete="current-password">
        <button type="button" class="toggle-password" aria-label="Mostrar contrasena" aria-pressed="false">
          <i class="fas fa-eye-slash icon" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Botones de accion -->
      <div class="btn-group">
        <button type="submit" class="btn-accept">
          <i class="fas fa-sign-in-alt"></i> Iniciar sesion
        </button>
        <button type="button" class="btn-cancel" onclick="clearForm()">
          <i class="fas fa-times"></i> Cancelar
        </button>
      </div>

      <a href="#" class="forgot">
        <i class="fas fa-question-circle"></i> Problemas con el acceso?
      </a>

      <p id="message"></p>
    </form>
  </main>

    <script src="js/techstore-app.js"></script>
  <script src="js/techstore-shell.js"></script>
  <script src="js/techstore-ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
