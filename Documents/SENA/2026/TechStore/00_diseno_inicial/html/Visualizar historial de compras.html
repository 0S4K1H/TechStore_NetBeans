<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/visualizar historial de compras.css">
    <link rel="stylesheet" href="css/techstore-shell.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>Visualizar historial de compras | TechStore</title>
</head>

<body>
  <div class="curve-top"></div>

  <div class="code-bg" aria-hidden="true">
    <i class="fas fa-code"></i>
    <i class="fas fa-laptop-code"></i>
    <i class="fab fa-js"></i>
    <i class="fas fa-database"></i>
    <i class="fas fa-server"></i>
    <i class="fas fa-microchip"></i>
    <i class="fas fa-terminal"></i>
    <i class="fas fa-cogs"></i>
  </div>

  <main class="card">
    <header class="header">
      <div class="logo-container">
        <img src="img/Techstore-logo.png" alt="Logo TechStore">
      </div>
      <div class="brand-icon" aria-hidden="true">
        <i class="fas fa-clock-rotate-left"></i>
      </div>
      <h1 class="title">TECHSTORE</h1>
      <p class="subtitle">Visualizar historial de compras</p>
    </header>

    <section class="filters-panel">
      <form id="filterForm" class="filters-form">
        <div class="input-group">
          <i class="fas fa-search icon"></i>
          <input type="text" id="searchInput" placeholder="Buscar por codigo o producto">
        </div>

        <div class="input-group">
          <i class="fas fa-truck icon"></i>
          <select id="statusFilter">
            <option value="">Todos los estados</option>
            <option value="entregado">Entregado</option>
            <option value="en camino">En camino</option>
            <option value="preparacion">En preparacion</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>

        <div class="input-group">
          <i class="fas fa-arrow-down-wide-short icon"></i>
          <select id="sortFilter">
            <option value="recent">Mas reciente</option>
            <option value="oldest">Mas antiguo</option>
            <option value="high">Mayor valor</option>
            <option value="low">Menor valor</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit" class="btn-accept">
            <i class="fas fa-filter"></i> Filtrar
          </button>
          <button type="button" id="clearBtn" class="btn-cancel">
            <i class="fas fa-eraser"></i> Limpiar
          </button>
        </div>
      </form>
    </section>

    <section class="stats-grid" id="statsGrid">
      <article class="stat-card">
        <span>Total compras</span>
        <strong id="statOrders">0</strong>
      </article>
      <article class="stat-card">
        <span>Total invertido</span>
        <strong id="statSpent">$0</strong>
      </article>
      <article class="stat-card">
        <span>Pedidos entregados</span>
        <strong id="statDelivered">0</strong>
      </article>
      <article class="stat-card">
        <span>Ticket promedio</span>
        <strong id="statAverage">$0</strong>
      </article>
    </section>

    <section class="layout">
      <section class="history-panel">
        <h2 class="section-title">Listado de compras</h2>
        <ul id="historyList" class="history-list"></ul>
      </section>

      <aside class="detail-panel">
        <h2 class="section-title">Detalle de compra</h2>
        <div id="detailBox" class="detail-box">
          <div class="empty-detail">
            <i class="fas fa-receipt"></i>
            <p>Selecciona una compra para ver su detalle.</p>
          </div>
        </div>
      </aside>
    </section>

    <p id="message">Puedes filtrar por estado, texto o valor de compra.</p>
  </main>

    <script src="js/techstore-app.js"></script>
  <script src="js/techstore-shell.js"></script>
  <script src="js/techstore-ui.js"></script>
  <script src="js/history.js"></script>
</body>

</html>
